# Tests the static site on every push and pull request. No build: the repo files are the site.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: node --test

      - name: Build
        run: node build.js

      # The same files as dist/, ready to upload to Hostinger's public_html.
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site-${{ github.sha }}
          path: dist/
          include-hidden-files: true # .htaccess
          if-no-files-found: error
          retention-days: 90
